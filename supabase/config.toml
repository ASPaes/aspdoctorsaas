# ds-enviar-whatsapp-externo: chamada pelo DoctorDev, que nao tem JWT deste projeto.
# A auth e HMAC-SHA256 sobre o payload (segredo DEVFLOW_WA_SECRET), igual ao SSO.
# Com verify_jwt=true o gateway barraria a chamada antes de chegar na function.
[functions.ds-enviar-whatsapp-externo]
verify_jwt = false

# recon-espelho-pull-cron: chamada pelo pg_cron (via pg_net), que nao tem JWT de usuario.
# A auth mora dentro da function: segredo dedicado no vault (obter_segredo_cron_espelho),
# comparado com o Bearer recebido. Producao ja estava com false -- sem esta entrada o CI
# deployaria com o padrao true e mataria o cron do espelho em silencio.
[functions.recon-espelho-pull-cron]
verify_jwt = false

# ==============================================================================
# 07/08/2026 — verify_jwt = TRUE EXPLICITO.
#
# Este arquivo so listava as functions com verify_jwt=false, na crenca de que o padrao do CI
# fosse true. E o contrario: deployar um slug ausente daqui grava verify_jwt=FALSE.
# Medido no push da F2b -- as 10 functions abaixo entraram no repo com true em producao e
# sairam do deploy com false. Nenhuma das 73 ja declaradas se mexeu.
#
# Todas fazem auth por dentro (auth.getUser, e a recon-omie-escrever tambem checa papel e
# tenant), entao nao houve acesso a dado -- mas o portao do gateway sumiu sem ninguem decidir.
# Declarar true e o unico jeito de nao depender do padrao.
# ==============================================================================

[functions.omie-integration-call]
