# Traz as filiais do DoctorOEM para o espelho e monta o de/para com clientes.
# Chamada por agendamento/painel com a service_role. Nunca pelo navegador.
[functions.oem-espelho-sync]
verify_jwt = true

# Processa a oem_sync_fila. verify_jwt = FALSE de propósito: quem chama de 2 em
# 2 minutos é o cron_oem_sync, e o Bearer dele é o segredo do Vault, não um JWT
# — o gateway recusaria antes de a função rodar. A autenticação é feita por
# dentro: ou o segredo confere (fn_oem_cron_secret_ok), ou é um JWT de
# admin/head. Chamada anônima não passa.
[functions.oem-sync-processar]
verify_jwt = false

# Cancela um módulo da licença: dá a baixa no OEM (via DoctorOEM) e só então na
# ficha. Chamada pelo NAVEGADOR com o token da pessoa — é ela que assina o
# cancelamento no histórico —, por isso verify_jwt = true; a checagem de papel
# acontece de novo por dentro.
[functions.oem-cancelar-modulo]
verify_jwt = true

# Manda para o OEM o nome ou o CNPJ que a ficha tem, quando quem está
# desatualizado é o parceiro. Chamada pelo NAVEGADOR com o token da pessoa (é
# ela que assina a alteração no log), por isso verify_jwt = true; pode_decidir_oem
# roda de novo por dentro. Sem esta entrada o CI publicaria com false e mudaria
# a autenticação em silêncio.
[functions.oem-atualizar-cadastro-licenca]
verify_jwt = true

# Apaga do Storage a mídia de chat vencida (documento/vídeo/imagem; áudio nunca).
# Chamada pelo pg_cron, que manda a anon key no Authorization — a mesma receita
# do check-csat-timeout. `true` de propósito: sem JWT válido do projeto ninguém
# dispara uma purga de fora. Quem tem JWT só conseguiria antecipar o que já ia
# ser apagado à noite — o prazo e o filtro moram na fn_chat_media_purge_lote.
[functions.purge-chat-media]
verify_jwt = true

