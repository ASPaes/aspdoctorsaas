name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all functions (with retry)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set +e
          FAILED=""
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            ok=0
            for attempt in 1 2 3; do
              echo "::group::Deploy $fn (tentativa $attempt)"
              if supabase functions deploy "$fn" --project-ref "$PROJECT_REF"; then
                ok=1
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              sleep $((attempt * 10))
            done
            [ $ok -eq 0 ] && FAILED="$FAILED $fn"
          done
          if [ -n "$FAILED" ]; then
            echo "::error::Functions que falharam após 3 tentativas:$FAILED"
            exit 1
          fi
