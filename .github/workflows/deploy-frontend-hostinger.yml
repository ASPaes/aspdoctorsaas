name: Deploy Frontend (Hostinger)

# Auto-deploy do app (app.doctorsaas.com.br) no Hostinger.
# A cada push na main que toque o frontend, builda o Vite e envia SÓ o dist/ via FTPS.
# NÃO roda em push que só mexa em backend/docs (paths-ignore abaixo) — o deploy de
# edge functions é outro workflow (deploy-edge-functions.yml).
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'supabase/**'
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Evita dois deploys simultâneos sobrescrevendo um ao outro.
# ⚠️ cancel-in-progress mata a run anterior do grupo: re-executar duas runs com
# poucos segundos de diferença cancela a primeira (foi o que aconteceu com a
# run #162 em 11/08 — ela aparece cinza no GitHub e não é falha).
concurrency:
  group: deploy-frontend-hostinger
  cancel-in-progress: true

# ==============================================================================
# 13/08/2026 — POR QUE A PUBLICAÇÃO É UM JOB SEPARADO, REPETIDO ATÉ 3x.
#
# Sintoma: runs vermelhas espalhadas (#134, #137, #151, #152, #163, #170, #175),
# sempre no passo do FTPS, sempre com a MESMA assinatura:
#     Error: connect ETIMEDOUT <servidor>:21 (control socket)
# e sempre com duração de 133-135s — que é o tempo do kernel Linux insistindo no
# SYN (6 retries) antes de desistir. O servidor da Hostinger não respondeu NADA
# na porta 21: não houve login, não subiu arquivo, o dist/ nunca saiu do runner.
#
# O que descartou as hipóteses fáceis (medido em 13/08):
#   - Não é o build: o passo `Build` passou em todas as falhas.
#   - Não é a Hostinger fora do ar: a run #174 publicou 3 min antes da #175
#     falhar, e a porta 21 respondia na hora a partir da máquina do Alexandre.
#   - NÃO adianta repetir dentro do mesmo job: a run #175 tentou 3x ao longo de
#     10 min e as 3 deram ETIMEDOUT. Um job = uma VM = um IP de origem.
#
# Conclusão: a Hostinger bloqueia o IP de origem que o GitHub sorteou para
# aquele runner (IPs compartilhados, sujeitos ao anti-brute-force deles). A
# única repetição que muda alguma coisa é a que roda em OUTRA máquina — ou seja,
# em outro job.
#
# Por isso: `build` uma vez (dist/ vai como artifact, sem rebuildar), e a
# publicação em até 3 jobs encadeados, cada um num runner novo. O passo do FTPS
# nos dois primeiros usa `continue-on-error` para a run não ficar vermelha
# quando um retry salva o deploy; o terceiro é sem rede — se ele falhar, o
# deploy falhou de verdade e tem que aparecer.
#
# Se um dia as 3 falharem juntas, a saída não é uma 4ª tentativa: é trocar o
# transporte (SSH/rsync na 22) ou o host. Ver a memória deploy-manual-ftps-hostinger.
# ==============================================================================

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # Sem --frozen-lockfile de propósito: o repo tem 3 lockfiles e pode haver
      # drift; frozen quebraria o CI sem ganho real aqui.
      - name: Install deps
        run: bun install

      # As envs VITE_* vêm do .env commitado (Vite carrega automático). Nenhum
      # segredo de build é necessário — só as credenciais de FTP do Hostinger.
      - name: Build
        run: bun run build

      # O MESMO dist/ é publicado pelas 3 tentativas. Rebuildar em cada job
      # geraria hashes novos e a tentativa 2 subiria arquivos diferentes da 1.
      - name: Guarda o dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.ftp.outcome }}
    steps:
      - name: Baixa o dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # v4.3.5 → v4.4.0: a v4.3.5 declara runtime node20, que o runner já força
      # para node24 desde ago/2026 (o warning "Node.js 20 is deprecated" no log).
      # A v4.4.0 só oficializa isso — não muda nada do protocolo.
      - name: Deploy via FTPS
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # O padrão é 60000 (60s por operação FTP). Em 04/08/2026 o deploy do
          # preview de PDF morreu com "Timeout (control socket)" DEPOIS de subir
          # os arquivos: o site atualizou e o job ficou vermelho. Durante um
          # upload grande, o socket de controle espera o "226 transfer complete"
          # parado — e o Hostinger passa dos 60s quando o dist/ vai inteiro.
          # Isso acontece justamente quando o .ftp-deploy-sync-state.json não foi
          # gravado na run anterior (falha no fim = estado velho = reenvia tudo),
          # ou seja: uma falha dessas alimenta a próxima.
          timeout: 180000
          local-dir: ./dist/
          # Pasta-raiz do subdomínio no Hostinger. Se a conta FTP já abrir dentro
          # do docroot do app, use ./ ; senão o caminho completo (terminar com /).
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}

  # Runner novo = IP novo. É essa a única coisa que muda entre as tentativas.
  deploy-retry-1:
    needs: [build, deploy]
    if: needs.deploy.outputs.status == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.ftp.outcome }}
    steps:
      - name: Baixa o dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy via FTPS (2a tentativa)
        id: ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 180000
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}

  # Última: SEM continue-on-error. Falhou aqui, a run fica vermelha de propósito.
  deploy-retry-2:
    needs: [build, deploy, deploy-retry-1]
    if: needs.deploy-retry-1.outputs.status == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixa o dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy via FTPS (3a tentativa)
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 180000
          local-dir: ./dist/
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
